<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Tidak ada koneksi — e-Raport</title>
        <meta name="theme-color" content="#047857" />
        <link rel="icon" type="image/png" href="/images/eraport-icon.png" />
        <style>
            :root {
                color-scheme: light dark;
                --latar: #f1f5f9;
                --kartu: #ffffff;
                --teks: #0f172a;
                --teks-redup: #64748b;
                --aksen: #047857;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --latar: #020617;
                    --kartu: #0f172a;
                    --teks: #f8fafc;
                    --teks-redup: #94a3b8;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                background: var(--latar);
                color: var(--teks);
            }

            .kartu {
                width: 100%;
                max-width: 360px;
                padding: 28px 24px;
                text-align: center;
                border-radius: 24px;
                background: var(--kartu);
                box-shadow: 0 20px 45px -20px rgba(15, 23, 42, 0.35);
            }

            .ikon {
                width: 72px;
                height: 72px;
                margin: 0 auto 16px;
                border-radius: 20px;
            }

            h1 {
                margin: 0 0 8px;
                font-size: 1.15rem;
            }

            p {
                margin: 0 0 20px;
                font-size: 0.9rem;
                line-height: 1.6;
                color: var(--teks-redup);
            }

            button {
                width: 100%;
                padding: 14px 18px;
                font-size: 0.95rem;
                font-weight: 600;
                color: #ffffff;
                background: var(--aksen);
                border: 0;
                border-radius: 14px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="kartu">
            <img class="ikon" src="/images/pwa-192.png" alt="e-Raport" />
            <h1>Tidak ada koneksi</h1>
            <p>
                Aplikasi guru butuh koneksi internet untuk memuat dan menyimpan nilai. Sambungkan kembali perangkat
                Anda, lalu coba lagi.
            </p>
            <button type="button" onclick="window.location.reload()">Coba lagi</button>
        </div>
    </body>
</html>
